[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Erzwingt C++20 Standards
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++2a

; micro-ROS Konfiguration
board_microros_transport = serial
board_microros_distro = humble 

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    ; Deine lokale Lib ist bereits inkludiert durch die Ordnerstruktur, 
    ; aber explizit schadet nicht, falls du sie auslagern willst:
    ; StatusLed