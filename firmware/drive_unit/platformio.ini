[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Erzwingt C++20 Standards
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++2a

; Falls du später micro-ROS hinzufügst, kommen hier die libs rein
lib_deps =